name: Epic
description: Template for tracking large features (epics) from the product owner perspective
title: "<Descriptive Title>"
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Describe why this feature is needed from the product owner's view. Explain the business value and the problem it solves.
      placeholder: >
        Example:
        As a product owner, I want users to create custom dashboards so that they can monitor their KPIs in real time.
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: Goals
      description: Key goals or outcomes expected from this epic.
      placeholder: |
        - Provide a unified dashboard UI
        - Support custom widgets
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: High-level scope of work. Mention what's included and what's not.
      placeholder: |
        Included:
        - Frontend components
        - Backend API endpoints
        Excluded:
        - Mobile app changes

  - type: textarea
    id: sub_issues
    attributes:
      label: Sub-Issues
      description: List of child issues or tasks needed to implement this epic. Use GitHub issue references (#123) when available.
      placeholder: |
        - [ ] #123 Create dashboard backend
        - [ ] #124 Build dashboard UI
        - [ ] #125 Add authentication checks
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks / Dependencies
      description: Known risks, dependencies, or external factors.
      placeholder: |
        - Depends on API v2 release
        - Risk of performance degradation
